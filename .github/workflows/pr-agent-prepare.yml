name: PR Agent Prepare

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number
        required: true
        type: number

jobs:
  prepare:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/pr-agent prepare'))
    runs-on: ${{ vars.OPENCODE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      checks: write
      contents: write
      pull-requests: write
      issues: write
      packages: read
    env:
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      ACTOR: ${{ github.actor }}
      EVENT_NAME: ${{ github.event_name }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/minimax-m2.5-free' }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark prepare as running
        if: github.event_name != 'pull_request'
        id: prepare_check_start
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number(process.env.PR_NUMBER);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber
            });

            if (context.payload.comment?.id) {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner,
                  repo,
                  comment_id: context.payload.comment.id,
                  content: "eyes"
                });
              } catch (error) {
                core.warning(`failed to add reaction: ${error instanceof Error ? error.message : String(error)}`);
              }
            }

            const check = await github.rest.checks.create({
              owner,
              repo,
              name: "prepare",
              head_sha: pr.data.head.sha,
              status: "in_progress",
              details_url: runUrl,
              output: {
                title: "PR agent prepare running",
                summary: "The PR agent is analyzing this pull request and branch merging should stay blocked until this rerun finishes."
              }
            });

            core.setOutput("check_id", String(check.data.id));
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install OpenCode CLI
        run: npx flue install
      - name: Run prepare workflow
        id: run_prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARE_BRANCH_PREFIX: agent/prepared
        run: |
          ARGS=$(jq -nc \
            --arg owner "$OWNER" \
            --arg repo "$REPO" \
            --arg actor "$ACTOR" \
            --arg trigger "$EVENT_NAME" \
            --arg commentBody "$COMMENT_BODY" \
            --arg prepareBranchPrefix "$PREPARE_BRANCH_PREFIX" \
            --argjson pullNumber "$PR_NUMBER" \
            '{owner:$owner,repo:$repo,pullNumber:$pullNumber,actor:$actor,trigger:$trigger,commentBody:$commentBody,prepareBranchPrefix:$prepareBranchPrefix}')
          npx flue run .flue/workflows/pr-prepare.ts \
            --args "$ARGS" \
            --model "$OPENCODE_MODEL"
      - name: Finalize prepare check
        if: always() && github.event_name != 'pull_request' && steps.prepare_check_start.outputs.check_id != ''
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ steps.prepare_check_start.outputs.check_id }}
          RUN_OUTCOME: ${{ steps.run_prepare.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const checkRunId = Number(process.env.CHECK_ID);
            const outcome = process.env.RUN_OUTCOME;

            let conclusion = "success";
            let title = "PR agent prepare passed";
            let summary = "The rerun finished successfully.";

            if (outcome === "failure") {
              conclusion = "failure";
              title = "PR agent prepare failed";
              summary = "The rerun failed. Branch merging should remain blocked until prepare passes again.";
            } else if (outcome === "cancelled") {
              conclusion = "cancelled";
              title = "PR agent prepare cancelled";
              summary = "The rerun was cancelled before completion.";
            }

            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: checkRunId,
              status: "completed",
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title,
                summary
              }
            });

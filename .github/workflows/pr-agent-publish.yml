name: PR Agent Publish

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number
        required: true
        type: number
      comment_body:
        description: Slash command, e.g. /pr-agent publish branch=agent/prepared/pr-12-abcdef1 sha=abcdef123456
        required: true
        type: string

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/pr-agent publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: read
    env:
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      ACTOR: ${{ github.actor }}
      COMMENT_BODY: ${{ github.event.comment.body || inputs.comment_body }}
      FLUE_USE_SANDBOX: ${{ vars.FLUE_USE_SANDBOX || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install OpenCode CLI
        if: env.FLUE_USE_SANDBOX != 'true'
        run: npx flue install
      - name: Log in to GHCR
        if: env.FLUE_USE_SANDBOX == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull sandbox image
        if: env.FLUE_USE_SANDBOX == 'true'
        run: docker pull "ghcr.io/${GITHUB_REPOSITORY,,}/flue-sandbox:latest"
      - name: Run publish workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pull_number }}
          OPENCODE_MODEL: opencode/minimax-m2.5-free
        run: |
          EXTRA_ARGS=""
          if [ "$FLUE_USE_SANDBOX" = "true" ]; then
            EXTRA_ARGS="--sandbox ghcr.io/${GITHUB_REPOSITORY,,}/flue-sandbox:latest"
          fi
          ARGS=$(jq -nc \
            --arg owner "$OWNER" \
            --arg repo "$REPO" \
            --arg actor "$ACTOR" \
            --arg commentBody "$COMMENT_BODY" \
            --argjson pullNumber "$PR_NUMBER" \
            '{owner:$owner,repo:$repo,pullNumber:$pullNumber,actor:$actor,commentBody:$commentBody}')
          npx flue run .flue/workflows/pr-publish.ts \
            $EXTRA_ARGS \
            --args "$ARGS" \
            --model "$OPENCODE_MODEL"

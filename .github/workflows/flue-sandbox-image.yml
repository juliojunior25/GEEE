name: Build Flue Sandbox Image

on:
  push:
    branches:
      - main
    paths:
      - ".flue/sandbox/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push sandbox image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/flue-sandbox:latest"
          docker build -t "$IMAGE" -f .flue/sandbox/Dockerfile .
          docker push "$IMAGE"
